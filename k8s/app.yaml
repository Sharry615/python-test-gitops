apiVersion: v1
kind: Namespace
metadata:
  name: python-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-test-code
  namespace: python-test
data:
  app.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import json
    import socket
    from datetime import datetime, timezone

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path not in ("/", "/health"):
                self.send_response(404)
                self.end_headers()
                return
            body = json.dumps({
                "application": "python-test",
                "status": "ok",
                "hostname": socket.gethostname(),
                "time_utc": datetime.now(timezone.utc).isoformat()
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-test
  namespace: python-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-test
  template:
    metadata:
      labels:
        app: python-test
    spec:
      containers:
        - name: python
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: python-test-code
---
apiVersion: v1
kind: Service
metadata:
  name: python-test
  namespace: python-test
spec:
  type: NodePort
  selector:
    app: python-test
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
